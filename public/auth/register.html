<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Taleb AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✦%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-taleb-page="register">
  <div class="bg-anim"></div>
  <div class="bg-grid"></div>
  <div class="orb o1"></div><div class="orb o2"></div>

  <header class="navbar" id="navbar"></header>

  <section class="section">
    <div class="container">
      <div class="form-wrap glass-strong">
        <div style="text-align:center; margin-bottom:18px;">
          <div class="brand-logo" style="margin:0 auto 12px;">✦</div>
        </div>
        <h2 data-i18n="auth.registerTitle">Create account</h2>
        <p class="sub" data-i18n="auth.registerSub">Join the Taleb AI community today</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label data-i18n="auth.name">Full name</label>
            <input type="text" name="name" required minlength="2" placeholder="Ahmed Benali" />
            <div class="err">Please enter your full name</div>
          </div>
          <div class="field">
            <label data-i18n="auth.email">Email address</label>
            <input type="email" name="email" required placeholder="you@example.com" />
            <div class="err">Please enter a valid email</div>
          </div>
          <div class="field">
            <label data-i18n="auth.level">Study level</label>
            <select name="level" required>
              <option value="BEM">BEM (Year 4 middle)</option>
              <option value="BAC" selected>BAC (High school)</option>
              <option value="University">University</option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="auth.password">Password</label>
            <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" />
            <div class="err">Password must be at least 6 characters</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.registerBtn">Create account</button>
        </form>

        <div class="form-footer">
          <span data-i18n="auth.hasAccount">Already have an account?</span>
          <a href="/auth/login.html" data-i18n="auth.signin">Sign in</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
