<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Taleb AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✦%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-taleb-page="login">
  <div class="bg-anim"></div>
  <div class="bg-grid"></div>
  <div class="orb o1"></div><div class="orb o2"></div>

  <header class="navbar" id="navbar"></header>

  <section class="section">
    <div class="container">
      <div class="form-wrap glass-strong">
        <div style="text-align:center; margin-bottom:18px;">
          <div class="brand-logo" style="margin:0 auto 12px;">✦</div>
        </div>
        <h2 data-i18n="auth.loginTitle">Welcome back</h2>
        <p class="sub" data-i18n="auth.loginSub">Sign in to continue your journey</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label data-i18n="auth.email">Email address</label>
            <input type="email" name="email" required placeholder="you@example.com" />
            <div class="err">Please enter a valid email</div>
          </div>
          <div class="field">
            <label data-i18n="auth.password">Password</label>
            <input type="password" name="password" required minlength="6" placeholder="••••••••" />
            <div class="err">Password must be at least 6 characters</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.loginBtn">Sign in</button>
        </form>

        <div class="form-footer">
          <span data-i18n="auth.noAccount">Don't have an account?</span>
          <a href="/auth/register.html" data-i18n="auth.signup">Sign up</a>
        </div>

        <div style="margin-top:22px; padding:14px; border-radius:12px; background:var(--surface); border:1px dashed var(--border); font-size:12.5px; color:var(--text-dim);">
          <strong>Demo accounts:</strong><br/>
          Admin: <code>sidahmedag99@gmail.com</code> / <code>admin123</code><br/>
          Student: <code>amina@demo.dz</code> / <code>demo123</code>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
