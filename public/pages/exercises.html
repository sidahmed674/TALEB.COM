<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercises — Taleb AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✦%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-taleb-page="exercises">
  <div class="bg-anim"></div>
  <div class="bg-grid"></div>
  <div class="orb o1"></div><div class="orb o2"></div>

  <header class="navbar" id="navbar"></header>

  <div class="page-header">
    <div class="container">
      <span class="eyebrow">Practice makes perfect</span>
      <h1>📝 Exercises & Solutions</h1>
      <p>Sharpen your skills with curated exercises — each one comes with a detailed solution.</p>
    </div>
  </div>

  <div class="container" style="padding-bottom:60px;">
    <div class="filter-bar">
      <input type="text" id="ex-search" placeholder="🔍 Search exercises…" />
      <select id="ex-subject">
        <option value="">All subjects</option>
        <option value="math">Mathematics</option>
        <option value="phys">Physics</option>
        <option value="arab">Arabic</option>
        <option value="sci">Sciences</option>
      </select>
      <select id="ex-diff">
        <option value="">All levels</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div id="ex-list"></div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="/js/core.js"></script>
  <script src="/js/pages.js"></script>
</body>
</html>
