<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Taleb AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✦%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-taleb-page="community">
  <div class="bg-anim"></div>
  <div class="bg-grid"></div>
  <div class="orb o1"></div><div class="orb o2"></div>

  <header class="navbar" id="navbar"></header>

  <div class="page-header">
    <div class="container">
      <span class="eyebrow">Community</span>
      <h1>💬 Student Discussions</h1>
      <p>Share notes, ask questions, and connect with students across Algeria.</p>
    </div>
  </div>

  <div class="container" style="max-width:820px; padding-bottom:60px;">
    <!-- Composer -->
    <div class="card" style="padding:18px; margin-bottom:20px;">
      <div id="composer-guest" class="muted" style="text-align:center; padding:14px 0;">
        Please <a href="/auth/login.html" style="color:var(--primary); font-weight:600;">sign in</a> to post.
      </div>
      <form id="post-form" class="hidden">
        <div style="display:flex; gap:12px; align-items:flex-start;">
          <div class="post-avatar" id="composer-avatar">?</div>
          <div style="flex:1;">
            <textarea id="post-content" rows="3" placeholder="Share something with the community…"
              style="width:100%; padding:12px 14px; border-radius:12px; background:var(--bg-1); border:1px solid var(--border); color:var(--text); font-size:14.5px; resize:vertical;"></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:10px;">
              <button type="submit" class="btn btn-primary btn-sm">📣 Post</button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div id="posts-list"></div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="/js/core.js"></script>
  <script src="/js/pages.js"></script>
</body>
</html>
